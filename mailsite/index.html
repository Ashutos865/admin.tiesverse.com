<!doctype html>
<html lang="en">
  <head>
    <!-- The app icon, not the wordmark. The '.ties | Mail' lockup is 5:1, so as
         a favicon it shrank to an unreadable smear; the square envelope is what
         the floating button in the admin panel uses, so the tab and the button
         that opens it now show the same mark.
         .ico first, carrying 16/32/48 — the browser picks the size it needs
         rather than downscaling one big PNG in the tab strip. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <!-- The UI font. Preloaded because it is discovered inside a stylesheet
         that is itself discovered inside the JS bundle — three round trips
         deep, by which point the first paint has already happened in a
         fallback face and then visibly reflowed. -->
    <link rel="preload" href="/fonts/google-sans-latin.woff2" as="font"
          type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6ec" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="TIES Mail — sign in to your @mail.tiesverse.com mailbox." />
    <title>TIES Mail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
